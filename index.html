<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gaming Memories</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Rajdhani',Arial,sans-serif;
    background:#050505;
    color:#fff;
}

body{
    background:
        linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.45)),
        url("hero.png") center center / cover no-repeat;
}

/* DARK OVERLAY */

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(90deg,
        rgba(0,0,0,.72) 0%,
        rgba(0,0,0,.18) 45%,
        rgba(0,0,0,.55) 100%);
    pointer-events:none;
}

/* TOP NAV */

.nav{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:95px;
    display:flex;
    align-items:center;
    padding:0 48px;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:500;
    letter-spacing:3px;
    margin-right:70px;
    opacity:.9;
}

.logo span{
    color:#aaa;
}

.navlinks{
    display:flex;
    gap:55px;
}

.navlinks a{
    color:#ddd;
    text-decoration:none;
    font-size:15px;
    letter-spacing:3px;
    transition:.3s;
}

.navlinks a:hover{
    color:white;
}

.navlinks a:first-child{
    color:white;
}

.menu{
    margin-left:auto;
    font-size:31px;
    cursor:pointer;
    line-height:1;
}

/* LEFT MENU */

.side{
    position:absolute;
    left:60px;
    top:245px;
    z-index:5;
}

.line{
    width:1px;
    height:280px;
    background:rgba(255,255,255,.55);
    position:absolute;
    left:4px;
    top:-5px;
}

.side-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:27px;
    padding-left:38px;
    color:#ddd;
    font-size:14px;
    letter-spacing:4px;
}

.side-item::before{
    content:"";
    position:absolute;
    left:0;
    width:9px;
    height:9px;
    border:1px solid white;
    border-radius:50%;
    background:#050505;
}

/* MAIN TITLE */

.title{
    position:absolute;
    right:70px;
    bottom:165px;
    z-index:5;
    text-align:right;
}

.title h1{
    font-family:Georgia,serif;
    font-size:92px;
    line-height:.8;
    letter-spacing:2px;
    color:#777;
    text-shadow:
        2px 2px 0 #222,
        -1px -1px 0 #aaa;
}

.title h2{
    font-size:31px;
    font-weight:400;
    letter-spacing:15px;
    margin-top:20px;
    color:#ddd;
}

.title .smallline{
    width:280px;
    height:1px;
    background:#888;
    margin:17px 0 0 auto;
}

/* PLATFORM */

.platforms{
    position:absolute;
    left:60px;
    bottom:100px;
    z-index:5;
}

.platform-title{
    font-size:10px;
    letter-spacing:3px;
    color:#aaa;
    margin-bottom:12px;
}

.platform-buttons{
    display:flex;
    gap:10px;
}

.platform{
    border:1px solid #555;
    padding:9px 17px;
    font-size:11px;
    letter-spacing:2px;
    background:rgba(0,0,0,.35);
}

/* BOTTOM */

.bottom{
    position:absolute;
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    text-align:center;
}

.bottom-line{
    width:150px;
    height:1px;
    background:#888;
    margin:auto;
}

.bottom p{
    margin-top:14px;
    font-size:10px;
    letter-spacing:5px;
    color:#aaa;
}

/* NEXT */

.next{
    position:absolute;
    right:45px;
    bottom:45px;
    z-index:5;
    color:#ddd;
    font-size:15px;
    letter-spacing:2px;
}

/* MOBILE */

@media(max-width:700px){

    .nav{
        height:75px;
        padding:0 25px;
    }

    .logo{
        font-size:20px;
        margin-right:0;
    }

    .navlinks{
        display:none;
    }

    .menu{
        font-size:27px;
    }

    .side{
        left:25px;
        top:180px;
    }

    .side-item{
        font-size:11px;
        margin-bottom:23px;
        letter-spacing:3px;
    }

    .title{
        right:25px;
        bottom:150px;
    }

    .title h1{
        font-size:52px;
    }

    .title h2{
        font-size:18px;
        letter-spacing:9px;
    }

    .title .smallline{
        width:160px;
    }

    .platforms{
        left:25px;
        bottom:65px;
    }

    .next{
        right:20px;
        bottom:20px;
        font-size:11px;
    }

    .bottom{
        display:none;
    }
}
</style>
</head>

<body>

<!-- TOP -->

<div class="nav">

    <div class="logo">
        GAM<span>I</span>NG
    </div>

    <div class="navlinks">
        <a href="#">GAMES</a>
        <a href="#">SCREENSHOTS</a>
        <a href="#">VIDEOS</a>
        <a href="#">COMPLETED</a>
    </div>

    <div class="menu">☰</div>

</div>


<!-- LEFT -->

<div class="side">

    <div class="line"></div>

    <div class="side-item">🎮 &nbsp; GAMES</div>

    <div class="side-item">▧ &nbsp; SCREENSHOTS</div>

    <div class="side-item">▷ &nbsp; VIDEOS</div>

    <div class="side-item">♜ &nbsp; COMPLETED</div>

</div>


<!-- TITLE -->

<div class="title">

    <h1>GAMING</h1>

    <h2>MEMORIES</h2>

    <div class="smallline"></div>

</div>


<!-- PLATFORMS -->

<div class="platforms">

    <div class="platform-title">
        MY PLATFORMS
    </div>

    <div class="platform-buttons">

        <div class="platform">
            ▣ &nbsp; PC
        </div>

        <div class="platform">
            ◉ &nbsp; PLAYSTATION
        </div>

    </div>

</div>


<!-- BOTTOM -->

<div class="bottom">

    <div class="bottom-line"></div>

    <p>SOME GAMES STAY FOREVER</p>

</div>


<div class="next">
    Next →
</div>

</body>
</html>
